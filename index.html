<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Goatheon - Loading</title>
    <meta http-equiv="refresh" content="0;url=loading.html">
    <!-- Google Fonts - Yatra One -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Silkscreen&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Jersey+10&display=swap" rel="stylesheet">
    <link rel="icon" href="assets/images/fav.png" type="image/png">


    <script>
        // Disable right-click
        document.addEventListener('contextmenu', (e) => e.preventDefault());
        
        // Disable keyboard shortcuts
        document.addEventListener('keydown', function(e) {
            if ((e.ctrlKey || e.metaKey) && 
                (e.key === 'u' || e.key === 's' || e.key === 'i' || e.key === 'c')) {
                e.preventDefault();
                return false;
            }
        });
    </script>

    <style>
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: 'Yatra One', cursive;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            padding: 0;
            text-align: center;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            -khtml-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }
        
        .redirect-message {
            max-width: 80%;
        }
        
        h1 {
            font-family: "Jersey 10", sans-serif;
            margin-bottom: 20px;
        }
        
        p {
            margin-bottom: 20px;
        }
        
        a {
            color: #ffffff;
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="redirect-message">
        <h1>GOATHEON</h1>
        <p>Redirecting to loading experience...</p>
        <p>If you are not redirected automatically, <a href="loading.html">click here</a>.</p>
    </div>
</body>
</html>
